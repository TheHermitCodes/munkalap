# Supabase CLI configuration for local development.
# Anything not listed here uses the CLI defaults.
project_id = "munkalap"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

# Catches emails sent by Supabase Auth locally: http://127.0.0.1:54324
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Off locally so sign-up logs you straight in. Turn it on in production:
# accept_invitation() only trusts confirmed email addresses.
enable_confirmations = false

[edge_runtime]
enabled = true

[functions.send-invite]
enabled = true
verify_jwt = true
import_map = "./functions/send-invite/deno.json"
entrypoint = "./functions/send-invite/index.ts"
