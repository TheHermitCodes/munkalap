name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      # The build inlines these. Real values come from the deploy environment.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Migrations, RLS tests, generated types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # The Supabase CLI comes from package-lock.json, so CI generates types
      # with exactly the version used locally.
      - run: npm ci
      # Applies every migration and the seed to a fresh Postgres.
      - run: npx supabase db start
      - run: npx supabase test db
      # Fails if someone changed the schema without regenerating the types.
      - name: Generated types match the schema
        run: |
          npm run db:types
          git diff --exit-code lib/database.types.ts
